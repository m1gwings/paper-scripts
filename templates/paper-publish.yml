# Managed by paper-scripts; upgrade with paper init.
name: Paper publish
run-name: paper-${{ inputs.operation }}-${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [sync, publish]
        required: true
      branch:
        type: string
        default: ''
      sha:
        type: string
        default: ''
      request_id:
        type: string
        required: true
permissions: {}
# Sync and publication share one writer. Never cancel a running publication.
# GitHub may replace an older pending run; clients surface that cancellation.
concurrency:
  group: paper-collaborative-writer
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: paper-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Synchronize or publish using trusted scripts
        env:
          GH_TOKEN: ${{ github.token }}
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
          PAPER_TRUSTED_CONFIG: .paper/config.json
          PAPER_TRUSTED_SHA: ${{ github.workflow_sha }}
          PAPER_OPERATION: ${{ inputs.operation }}
          PAPER_BRANCH: ${{ inputs.branch }}
          PAPER_SHA: ${{ inputs.sha }}
        run: python3 .paper/runtime/lib/ci.py
      - name: Publication notification
        if: always() && inputs.operation == 'publish'
        continue-on-error: true
        env:
          PAPER_NOTIFY_PROVIDER: ${{ vars.PAPER_NOTIFY_PROVIDER || 'none' }}
          PAPER_PUSHOVER_DEVICE: ${{ vars.PAPER_PUSHOVER_DEVICE }}
          PAPER_PUSHOVER_USER_KEY: ${{ secrets.PAPER_PUSHOVER_USER_KEY }}
          PAPER_PUSHOVER_APP_TOKEN: ${{ secrets.PAPER_PUSHOVER_APP_TOKEN }}
          PAPER_NOTIFY_WEBHOOK_URL: ${{ secrets.PAPER_NOTIFY_WEBHOOK_URL }}
          PAPER_RESULT: ${{ job.status }}
          PAPER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 .paper/runtime/lib/notify.py
          --title "Paper publication"
          --message "Publication result: $PAPER_RESULT. Check the run for details."
          --url "$PAPER_RUN_URL"
