# Managed by paper-scripts; upgrade with paper init.
name: Paper preview notification
on:
  workflow_run:
    workflows: ['Paper preview']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  notify:
    if: github.event.workflow_run.head_repository.full_name == github.repository
    environment: paper-notify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Never download or execute artifacts/source from the triggering branch.
      - name: Notify preview result
        env:
          GH_TOKEN: ${{ github.token }}
          PAPER_NOTIFY_PROVIDER: ${{ vars.PAPER_NOTIFY_PROVIDER || 'none' }}
          PAPER_PUSHOVER_USER_KEY: ${{ secrets.PAPER_PUSHOVER_USER_KEY }}
          PAPER_PUSHOVER_APP_TOKEN: ${{ secrets.PAPER_PUSHOVER_APP_TOKEN }}
          PAPER_NOTIFY_WEBHOOK_URL: ${{ secrets.PAPER_NOTIFY_WEBHOOK_URL }}
        run: python3 .paper/runtime/lib/preview_notify.py
