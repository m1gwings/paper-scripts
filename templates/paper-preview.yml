# Managed by paper-scripts; upgrade with paper init.
name: Paper preview
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paper-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    # First restoration of a full frozen TeX environment can be substantial.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse frozen TeX environment
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/paper/texlive
          key: ${{ runner.os }}-overleaf-${{ hashFiles('.paper/tex_environment.json') }}
          restore-keys: ${{ runner.os }}-overleaf-
      - name: Install TeX
        run: |
          # Avoid slow Azure mirror downloads exhausting the job timeout.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -qq
          if test -f .paper/tex_environment.json; then
            sudo apt-get install -y --no-install-recommends curl perl xz-utils
            python3 .paper/runtime/lib/tex_environment.py install
            exit 0
          fi
          sudo apt-get install -y --no-install-recommends latexmk lmodern texlive-latex-extra texlive-fonts-recommended texlive-science texlive-plain-generic
      - name: Compile with the declared environment, without credentials
        run: python3 .paper/runtime/lib/preview.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          path: .paper-preview/paper.pdf
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
